# Eval 04 — add a React component matching a precise prop signature.
# Covers: TypeScript / React boilerplate against a contract.

fixture:
  language: typescript-react
  starter:
    "package.json": |
      {
        "name": "eval-04",
        "version": "0.0.0",
        "scripts": {
          "test": "jest --silent",
          "tsc": "tsc --noEmit"
        },
        "devDependencies": {
          "@testing-library/react": "^15.0.0",
          "@testing-library/jest-dom": "^6.4.0",
          "@types/react": "^18.2.0",
          "@types/jest": "^29.5.0",
          "jest": "^29.7.0",
          "jest-environment-jsdom": "^29.7.0",
          "ts-jest": "^29.1.0",
          "react": "^18.2.0",
          "react-dom": "^18.2.0",
          "typescript": "^5.4.0"
        }
      }
    "tsconfig.json": |
      { "compilerOptions": { "jsx": "react-jsx", "strict": true, "esModuleInterop": true,
        "moduleResolution": "node", "target": "ES2022", "lib": ["ES2022", "DOM"] } }

task_spec:
  issue: "(eval) Add MacroChip component"
  target_branch_name: feature/eval-04-macro-chip

  files_to_create_or_edit:
    - src/components/MacroChip.tsx
    - src/components/__tests__/MacroChip.test.tsx

  function_signatures:
    - file: src/components/MacroChip.tsx
      exports:
        - "export function MacroChip(props: { label: string; grams: number; kcalPerGram: number }): JSX.Element"

  expected_diff_shape:
    - src/components/MacroChip.tsx: created (~15 lines, renders label + grams + computed kcal)
    - src/components/__tests__/MacroChip.test.tsx: created (~25 lines, 3 cases)

  test_files_and_cases:
    - file: src/components/__tests__/MacroChip.test.tsx
      cases:
        - "renders the label"
        - "renders grams with 'g' suffix"
        - "renders computed kcal (grams * kcalPerGram)"

  acceptance_check:
    command: "pnpm install --silent && pnpm test && pnpm tsc"
    expected: "exit code 0; 3 tests pass; no type errors"

  out_of_scope:
    - styling beyond minimum to render
    - state management
    - any other component
    - any new top-level dep

  allowed_new_dependencies:
    npm: []   # everything required is already in package.json

  budget:
    max_executor_attempts: 3
    max_codex_calls: 5
    wall_clock_hours: 1
