name: ai-system CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-health:
    name: Repo health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run scripts/repo_health.py
        run: python3 scripts/repo_health.py

  evals:
    name: Eval harness (regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install yq (mikefarah/yq — Go binary, not the Python wrapper from apt)
        run: |
          sudo wget -q -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Run evaluations
        run: python3 evaluations/run_evals.py
        # The executor is currently stubbed, so all tasks land "skipped" — that's
        # fine. When nightly v3+ wires in the real executor, this gate will
        # block PRs that drop the pass rate vs main.
